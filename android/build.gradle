group 'uk.co.moodio.msal_flutter'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.9.24' // <--- USAS KOTLIN NUEVO
    repositories {
        google()
        mavenCentral() // <--- jcenter eliminado
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "uk.co.moodio.msal_flutter" // <--- OBLIGATORIO para Gradle 8

    compileSdkVersion 34 // <--- ACTUALIZADO

    defaultConfig {
        minSdkVersion 26  // <--- TU PROYECTO USA 26
        targetSdkVersion 34
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // MSAL
    implementation 'com.microsoft.identity.client:msal:4.0.2'
}
